# General settings
[general]
import = []
live_config_reload = false

# Window settings
[window]
decorations = "Full"
opacity = 1.0 # decimal value 0.0 to 1.0
blur = true

# Font settings
[font]
size = 10.0

[font.normal]
family = "monospace"
style = "Regular"

# Color scheme (Example: One Dark style)
[colors.primary]
background = "#000000"
# foreground = "#abb2bf"

[colors.normal]
black = "#282c34"
red = "#e06c75"
green = "#98c379"
yellow = "#e5c07b"
blue = "#61afef"
magenta = "#c678dd"
cyan = "#56b6c2"
white = "#abb2bf"

[colors.bright]
black = "#5c6370"
red = "#e06c75"
green = "#98c379"
yellow = "#e5c07b"
blue = "#61afef"
magenta = "#c678dd"
cyan = "#56b6c2"
white = "#ffffff"

